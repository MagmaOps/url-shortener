# Application DATABASE_URL secret — EXAMPLE / REFERENCE ONLY. NOT APPLIED.
#
# This file documents the shape of the app-secret. The real secret is delivered
# as an encrypted SealedSecret (k8s/app-sealedsecret.yaml), which is safe to
# commit.
#
# The value below is fake. Do NOT `kubectl apply` this file and do NOT put real
# credentials in it. To (re)generate the SealedSecret from real values:
#
#   kubectl create secret generic app-secret \
#     --namespace url-shortener \
#     --from-literal=DATABASE_URL='postgresql+asyncpg://url_shortener:<real-password>@postgres:5432/url_shortener' \
#     --dry-run=client -o yaml \
#   | kubeseal --cert homelab-pub-cert.pem --format yaml \
#   > k8s/app-sealedsecret.yaml
#
# Driver: postgresql+asyncpg | Host: postgres | Port: 5432
# The embedded password MUST match POSTGRES_PASSWORD in postgres-secret.example.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: url-shortener
  labels:
    app.kubernetes.io/name: url-shortener
    app.kubernetes.io/part-of: url-shortener
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://url_shortener:change-me-example-password@postgres:5432/url_shortener
