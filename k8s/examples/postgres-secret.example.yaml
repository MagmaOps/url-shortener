# PostgreSQL credentials — EXAMPLE / REFERENCE ONLY. NOT APPLIED.
#
# This file documents the shape of the postgres-secret. It is intentionally
# NOT a real manifest you apply: the real secret is delivered as an encrypted
# SealedSecret (k8s/postgres-sealedsecret.yaml), which is safe to commit.
#
# The values below are fake. Do NOT `kubectl apply` this file and do NOT put
# real credentials in it. To (re)generate the SealedSecret from real values:
#
#   kubectl create secret generic postgres-secret \
#     --namespace url-shortener \
#     --from-literal=POSTGRES_DB=url_shortener \
#     --from-literal=POSTGRES_USER=url_shortener \
#     --from-literal=POSTGRES_PASSWORD='<real-strong-password>' \
#     --dry-run=client -o yaml \
#   | kubeseal --cert homelab-pub-cert.pem --format yaml \
#   > k8s/postgres-sealedsecret.yaml
#
# The password here MUST match the one embedded in DATABASE_URL
# (see app-secret.example.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: url-shortener
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: url-shortener
type: Opaque
stringData:
  POSTGRES_DB: url_shortener
  POSTGRES_USER: url_shortener
  POSTGRES_PASSWORD: change-me-example-password
