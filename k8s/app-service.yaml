# URL Shortener Service.
#
# A plain ClusterIP Service — reachable only inside the cluster. External
# access (NodePort / LoadBalancer / Ingress) is intentionally deferred to a
# later learning step.
#
# Routing: Service :8000 -> pod port named "http" (containerPort 8000).
apiVersion: v1
kind: Service
metadata:
  name: url-shortener
  namespace: url-shortener
  labels:
    app.kubernetes.io/name: url-shortener
    app.kubernetes.io/part-of: url-shortener
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: url-shortener
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
