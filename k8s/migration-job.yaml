# Database migration Job — runs `alembic upgrade head`.
#
# Migrations are deliberately kept OUT of application startup. This Job is the
# single, explicit place schema changes are applied. It uses the SAME image as
# the app so the migration scripts always match the deployed code.
#
# The app image's working directory is /app, which contains alembic.ini and the
# alembic/ directory, so `alembic upgrade head` runs correctly with no extra
# setup. Alembic reads only DATABASE_URL from the environment (see
# alembic/env.py), so the Job only needs that one value — supplied from the
# same Secret the app uses.
#
# Re-running: `alembic upgrade head` is idempotent (already-applied revisions
# are skipped), but a completed Job's name is immutable. To re-run after a new
# migration, delete the old Job first:
#   kubectl delete job db-migrate -n url-shortener
# then re-apply. (A generateName-based Job or a Helm/Argo hook would automate
# this later — see README.)
#
# Argo CD note (for the separate argocd-apps repo, NOT created here): this Job
# should be annotated as a PreSync hook so migrations run before the app rolls
# out, e.g. argocd.argoproj.io/hook: PreSync and
# argocd.argoproj.io/hook-delete-policy: BeforeHookCreation. That concern is
# intentionally left to the GitOps repo.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: url-shortener
  labels:
    app.kubernetes.io/name: url-shortener-migrate
    app.kubernetes.io/part-of: url-shortener
spec:
  # Give up after a handful of retries instead of looping forever if the DB is
  # genuinely unreachable.
  backoffLimit: 4
  template:
    metadata:
      labels:
        app.kubernetes.io/name: url-shortener-migrate
        app.kubernetes.io/part-of: url-shortener
    spec:
      # A migration should run to completion, not be restarted as a service.
      restartPolicy: Never
      containers:
        - name: migrate
          image: magmakomer/url-shortener:1.0.0
          # Override the image's default uvicorn command with the migration
          # command. workingDir is /app in the image; alembic.ini lives there.
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DATABASE_URL
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
