# Headless Service for the PostgreSQL StatefulSet.
#
# clusterIP: None makes this a headless Service, which is the idiomatic pairing
# for a StatefulSet: it gives each pod a stable DNS name
# (postgres-0.postgres.url-shortener.svc.cluster.local) while the Service name
# itself (postgres) also resolves to the single running pod.
#
# The application and migration Job connect using the short name "postgres"
# (same namespace), i.e. host "postgres", port 5432. PostgreSQL is never
# exposed outside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: url-shortener
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: url-shortener
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
