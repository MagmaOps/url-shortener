# Non-sensitive application configuration.
#
# Only values that are safe to expose in plain text live here. Sensitive
# connection details (which embed the DB password) live in app-secret.yaml.
#
# BASE_URL is the public root used to build the short URLs returned by the API.
# It MUST match the hostname exposed by app-ingress.yaml so the short links the
# API returns are reachable. If you change the Ingress host, change this too.
# (No trailing slash.)
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: url-shortener
  labels:
    app.kubernetes.io/name: url-shortener
    app.kubernetes.io/part-of: url-shortener
data:
  BASE_URL: "http://url.lab.local"
  LOG_LEVEL: "INFO"
